version: '3.8'

services:
  cstan-app:
    build: .
    container_name: cstan_safety_platform
    ports:
      - "5000:5000"
    environment:
      - SECRET_KEY=cstan-docker-production-secret-2026
      - FLASK_DEBUG=False
      - PORT=5000
    restart: unless-stopped
    volumes:
      - cstan_data:/app/instance

volumes:
  cstan_data:
